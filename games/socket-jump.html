<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Socket Jump — chpraph</title>
  <link rel="stylesheet" href="../assets/css/themes.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', system-ui, sans-serif;
      overflow: hidden;
    }

    /* ── Layout ── */
    .page {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* ── Header ── */
    .game-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 52px;
      padding: 0 1.25rem;
      background: var(--surface);
      border-bottom: 1px solid var(--border-strong);
      flex-shrink: 0;
      position: relative;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.875rem;
      font-family: 'JetBrains Mono', monospace;
      transition: color 0.2s;
      z-index: 1;
    }
    .back-btn:hover, .back-btn:focus-visible { color: var(--accent); }
    .back-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }
    .back-btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    .game-title {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      z-index: 1;
    }

    .game-tags {
      display: flex;
      gap: 0.4rem;
    }

    .tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.63rem;
      background: rgba(var(--accent-rgb), 0.18);
      border: 1px solid rgba(var(--accent-rgb), 0.35);
      color: var(--accent-hover);
      padding: 0.15rem 0.5rem;
      border-radius: 999px;
    }

    .fullscreen-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      background: var(--surface-raised);
      border: 1px solid var(--border-strong);
      border-radius: 6px;
      color: var(--text-muted);
      cursor: pointer;
      transition: color 0.2s, border-color 0.2s;
    }
    .fullscreen-btn:hover { color: var(--accent); border-color: var(--accent); }
    .fullscreen-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    .fullscreen-btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    /* ── Canvas area ── */
    .canvas-area {
      position: relative;
      flex: 1;
      overflow: hidden;
      background: #000;
    }

    #canvas {
      display: block;
      width: 100%;
      height: 100%;
      outline: none;
    }

    /* ── Loader overlay ── */
    #loader {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      background: var(--bg);
      z-index: 20;
      transition: opacity 0.5s ease;
    }
    #loader.fade-out { opacity: 0; pointer-events: none; }

    .loader-ring {
      position: relative;
      width: 64px;
      height: 64px;
    }
    .loader-ring svg {
      width: 64px;
      height: 64px;
      transform: rotate(-90deg);
    }
    .loader-ring .track {
      fill: none;
      stroke: var(--border-strong);
      stroke-width: 4;
    }
    .loader-ring .fill {
      fill: none;
      stroke: var(--accent);
      stroke-width: 4;
      stroke-linecap: round;
      stroke-dasharray: 163; /* 2π × 26 ≈ 163 */
      stroke-dashoffset: 163;
      transition: stroke-dashoffset 0.3s ease;
    }
    /* Spin animé tant que la progression est inconnue */
    .loader-ring.indeterminate .fill {
      animation: arc-spin 1.2s linear infinite;
      stroke-dashoffset: 40;
    }
    @keyframes arc-spin {
      from { transform: rotate(0deg);   }
      to   { transform: rotate(360deg); }
    }
    /* Le SVG tourne aussi pour l'anneau indéterminé */
    .loader-ring.indeterminate svg {
      transform-origin: center;
      animation: ring-rotate 1.4s linear infinite;
    }
    @keyframes ring-rotate {
      to { transform: rotate(360deg); }
    }

    .loader-info {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      text-align: center;
    }

    .loader-name {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 1.3rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: var(--text);
    }

    .loader-status {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      color: var(--text-muted);
      min-height: 1.2em;
    }

    /* Barre de progression */
    .progress-track {
      width: 220px;
      height: 3px;
      background: var(--border-strong);
      border-radius: 99px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), var(--accent-hover));
      border-radius: 99px;
      transition: width 0.25s ease;
    }

    /* ── État d'erreur ── */
    #error-state {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      background: var(--bg);
      z-index: 20;
      padding: 2rem;
      text-align: center;
    }
    #error-state.visible { display: flex; }

    .error-icon {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ef4444;
      font-size: 1.3rem;
    }

    .error-title {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      color: var(--text);
    }

    .error-msg {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      color: var(--text-muted);
      max-width: 440px;
      line-height: 1.6;
    }

    .btn-back-lg {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 0.5rem;
      padding: 0.55rem 1.1rem;
      background: var(--surface-raised);
      border: 1px solid var(--border-strong);
      border-radius: 8px;
      color: var(--text);
      text-decoration: none;
      font-size: 0.875rem;
      font-family: 'JetBrains Mono', monospace;
      transition: border-color 0.2s, color 0.2s;
    }
    .btn-back-lg:hover { border-color: var(--accent); color: var(--accent); }

    /* ── Reduced motion ── */
    @media (prefers-reduced-motion: reduce) {
      .loader-ring.indeterminate .fill,
      .loader-ring.indeterminate svg { animation: none; }
      #loader { transition: none; }
      .progress-fill { transition: none; }
    }

    /* ── Mobile ── */
    @media (max-width: 480px) {
      .game-title { font-size: 0.8rem; }
      .game-tags  { display: none; }
    }
  </style>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@700&family=DM+Sans:wght@400&family=JetBrains+Mono:wght@400;500&display=swap">
</head>
<body>
<div class="page">

  <header class="game-header">
    <a href="../index.html" class="back-btn" aria-label="Retour au portfolio">
      <svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
      Retour
    </a>

    <h1 class="game-title">Socket Jump</h1>

    <div class="header-right">
      <ul class="game-tags" role="list">
        <li class="tag">Jeux</li>
        <li class="tag">GDscript</li>
        <li class="tag">Godot</li>
      </ul>
      <button class="fullscreen-btn" id="fsBtn" aria-label="Plein écran" title="Plein écran">
        <svg id="fsIcon" viewBox="0 0 24 24" aria-hidden="true">
          <polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/>
          <line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/>
        </svg>
      </button>
    </div>
  </header>

  <div class="canvas-area" id="canvasArea">

    <!-- Overlay loader -->
    <div id="loader" role="status" aria-live="polite" aria-label="Chargement du jeu">
      <div class="loader-ring indeterminate" id="loaderRing">
        <svg viewBox="0 0 56 56" aria-hidden="true">
          <circle class="track" cx="28" cy="28" r="26"/>
          <circle class="fill"  cx="28" cy="28" r="26"/>
        </svg>
      </div>
      <div class="loader-info">
        <p class="loader-name">Socket Jump</p>
        <div class="progress-track" id="progressTrack" style="opacity:0">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <p class="loader-status" id="loaderStatus">Initialisation…</p>
      </div>
    </div>

    <!-- État d'erreur -->
    <div id="error-state" aria-live="assertive">
      <div class="error-icon" aria-hidden="true">✕</div>
      <p class="error-title">Impossible de charger le jeu</p>
      <p class="error-msg" id="errorMsg"></p>
      <a href="../index.html" class="btn-back-lg">← Retour au portfolio</a>
    </div>

    <!-- Canvas Godot -->
    <canvas id="canvas" tabindex="1" aria-label="Zone de jeu Socket Jump"></canvas>

  </div>
</div>

<script>
  // Chemin vers les fichiers de l'export Godot (sans extension)
  const GAME_BASE = '../sae-jeu-godot/Export/WEB/index';

  const canvas       = document.getElementById('canvas');
  const loader       = document.getElementById('loader');
  const loaderRing   = document.getElementById('loaderRing');
  const progressTrack= document.getElementById('progressTrack');
  const progressFill = document.getElementById('progressFill');
  const loaderStatus = document.getElementById('loaderStatus');
  const errorState   = document.getElementById('error-state');
  const errorMsg     = document.getElementById('errorMsg');
  const fsBtn        = document.getElementById('fsBtn');
  const fsIcon       = document.getElementById('fsIcon');
  const canvasArea   = document.getElementById('canvasArea');

  // ── Fullscreen ─────────────────────────────────────────────────
  const FS_ICON_EXPAND = `<polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/>`;
  const FS_ICON_EXIT   = `<polyline points="4 14 10 14 10 20"/><polyline points="20 10 14 10 14 4"/><line x1="10" y1="14" x2="3" y2="21"/><line x1="21" y1="3" x2="14" y2="10"/>`;

  fsBtn.addEventListener('click', () => {
    if (!document.fullscreenElement) {
      canvasArea.requestFullscreen().catch(() => {});
    } else {
      document.exitFullscreen();
    }
  });
  document.addEventListener('fullscreenchange', () => {
    const isFs = !!document.fullscreenElement;
    fsIcon.innerHTML = isFs ? FS_ICON_EXIT : FS_ICON_EXPAND;
    fsBtn.setAttribute('aria-label', isFs ? 'Quitter le plein écran' : 'Plein écran');
  });

  // ── Helpers loader ─────────────────────────────────────────────
  function setStatus(text) { loaderStatus.textContent = text; }

  function setProgress(pct) {
    pct = Math.min(100, pct);
    loaderRing.classList.remove('indeterminate');
    progressTrack.style.opacity = '1';
    progressFill.style.width = pct + '%';
    const circle = loaderRing.querySelector('.fill');
    circle.style.strokeDashoffset = 163 - (163 * pct / 100);
    setStatus(Math.round(pct) + '% — Chargement des ressources…');
  }

  function hideLoader() {
    loader.classList.add('fade-out');
    setTimeout(() => { loader.style.display = 'none'; }, 520);
    canvas.focus();
  }

  function showError(message) {
    loader.style.display = 'none';
    errorMsg.textContent = message;
    errorState.classList.add('visible');
  }

  // ── Chargement du moteur Godot ─────────────────────────────────
  setStatus('Chargement du moteur…');
  const engineScript = document.createElement('script');
  engineScript.src = GAME_BASE + '.js';

  engineScript.addEventListener('error', () => {
    showError('Fichier introuvable : "' + GAME_BASE + '.js"\nVérifie que le dossier sae-jeu-godot/Export/WEB/ est présent.');
  });

  engineScript.addEventListener('load', () => {
    setStatus('Moteur chargé — initialisation…');

    if (typeof Engine === 'undefined') {
      showError('La classe Engine est introuvable. Vérifie que index.js provient bien d\'un export Godot Web.');
      return;
    }

    // Config extraite de l'export Godot (fileSizes permet la barre de progression précise)
    const engine = new Engine({
      args:                         [],
      canvas:                       canvas,
      canvasResizePolicy:           2,
      emscriptenPoolSize:           8,
      ensureCrossOriginIsolationHeaders: false,
      executable:                   GAME_BASE,
      experimentalVK:               false,
      fileSizes: {
        [GAME_BASE + '.pck']:  10206804,
        [GAME_BASE + '.wasm']: 35739700,
      },
      focusCanvas:                  true,
      gdextensionLibs:              [],
      godotPoolSize:                4,
    });

    const missing = Engine.getMissingFeatures({ threads: false });
    if (missing.length > 0) {
      showError('Fonctionnalités manquantes dans ce navigateur :\n' + missing.join('\n'));
      return;
    }

    engine.startGame({
      onProgress: function(current, total) {
        if (current > 0 && total > 0) {
          setProgress((current / total) * 100);
        }
      },
    })
    .then(function() {
      setProgress(100);
      setTimeout(hideLoader, 350);
    })
    .catch(function(err) {
      showError(String(err.message || err));
    });
  });

  document.head.appendChild(engineScript);
</script>
</body>
</html>
