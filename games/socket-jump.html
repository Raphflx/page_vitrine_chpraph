<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Socket Jump — chpraph</title>
  <link rel="stylesheet" href="../assets/css/themes.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', system-ui, sans-serif;
      overflow: hidden;
    }

    /* ── Header ── */
    .game-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 52px;
      padding: 0 1.25rem;
      background: var(--surface);
      border-bottom: 1px solid var(--border-strong);
      flex-shrink: 0;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.875rem;
      font-family: 'JetBrains Mono', monospace;
      transition: color 0.2s;
    }
    .back-btn:hover,
    .back-btn:focus-visible { color: var(--accent); outline: none; }
    .back-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }

    .back-btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    .game-title {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      color: var(--text);
      letter-spacing: 0.04em;
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
    }

    .game-tags {
      display: flex;
      gap: 0.4rem;
    }

    .tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.63rem;
      background: rgba(var(--accent-rgb), 0.18);
      border: 1px solid rgba(var(--accent-rgb), 0.35);
      color: var(--accent-hover);
      padding: 0.15rem 0.5rem;
      border-radius: 999px;
      backdrop-filter: blur(4px);
    }

    /* ── Layout ── */
    .game-wrapper {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    .game-area {
      position: relative;
      flex: 1;
      overflow: hidden;
    }

    /* ── Iframe ── */
    #gameFrame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: #000;
    }

    /* ── Loader overlay ── */
    #loader {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.25rem;
      background: var(--bg);
      z-index: 10;
      transition: opacity 0.45s ease, visibility 0.45s;
    }

    #loader.loaded {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loader-ring {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: 3px solid var(--border-strong);
      border-top-color: var(--accent);
      animation: spin 0.9s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loader-label {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: var(--text);
    }

    .loader-sub {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      color: var(--text-muted);
      animation: blink 1.4s ease-in-out infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.35; }
    }

    /* ── Reduced motion ── */
    @media (prefers-reduced-motion: reduce) {
      .loader-ring { animation: none; border-top-color: var(--accent); }
      .loader-sub  { animation: none; }
      #loader      { transition: none; }
    }

    /* ── Mobile ── */
    @media (max-width: 480px) {
      .game-title { font-size: 0.85rem; }
      .game-tags  { display: none; }
    }
  </style>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@700&family=DM+Sans:wght@400&family=JetBrains+Mono:wght@400;500&display=swap">
</head>
<body>
  <div class="game-wrapper">

    <header class="game-header">
      <a href="../index.html" class="back-btn" aria-label="Retour au portfolio">
        <svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
        Retour
      </a>

      <h1 class="game-title">Socket Jump</h1>

      <ul class="game-tags" role="list">
        <li class="tag">Jeux</li>
        <li class="tag">GDscript</li>
        <li class="tag">Godot</li>
      </ul>
    </header>

    <div class="game-area">

      <div id="loader" role="status" aria-live="polite">
        <div class="loader-ring" aria-hidden="true"></div>
        <p class="loader-label">Socket Jump</p>
        <p class="loader-sub">Chargement du jeu…</p>
      </div>

      <!--
        IMPORTANT : remplacer le src ci-dessous par l'URL d'embed itch.io de ton jeu.
        Tu la trouveras sur ton dashboard itch.io → Edit game → Embed → "Embed in page"
        Format : https://itch.io/embed-upload/XXXXXXX?color=08080D
      -->
      <iframe
        id="gameFrame"
        src="https://patatuuu.itch.io/pixel-jump"
        title="Socket Jump — Jeu HTML"
        allowfullscreen
        allow="autoplay; fullscreen *"
        sandbox="allow-scripts allow-same-origin allow-forms allow-pointer-lock allow-popups"
        loading="eager"
      ></iframe>

    </div>
  </div>

  <script>
    const frame  = document.getElementById('gameFrame');
    const loader = document.getElementById('loader');

    frame.addEventListener('load', () => {
      loader.classList.add('loaded');
    });

    // Fallback : cache le loader après 8s au cas où l'event ne tire pas
    setTimeout(() => loader.classList.add('loaded'), 8000);
  </script>
</body>
</html>
