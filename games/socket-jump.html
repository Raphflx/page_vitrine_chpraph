<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="
    default-src  'none';
    style-src    'self' https://fonts.googleapis.com;
    font-src     https://fonts.gstatic.com;
    script-src   'self' 'wasm-unsafe-eval';
    img-src      'self' blob: data:;
    connect-src  'self' blob:;
    worker-src   'self' blob:;
    base-uri     'none';
  ">
  <title>Socket Jump — chpraph</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@700&family=DM+Sans:wght@400&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="../assets/css/themes.css">
  <link rel="stylesheet" href="socket-jump.css">
</head>
<body>
<div class="page">

  <header class="game-header">
    <a href="../index.html" class="back-btn" aria-label="Retour au portfolio">
      <svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
      Retour
    </a>

    <h1 class="game-title">Socket Jump</h1>

    <div class="header-right">
      <ul class="game-tags" role="list">
        <li class="tag">Jeux</li>
        <li class="tag">GDscript</li>
        <li class="tag">Godot</li>
      </ul>
      <button class="fullscreen-btn" id="fsBtn" aria-label="Plein écran" title="Plein écran">
        <svg id="fsIcon" viewBox="0 0 24 24" aria-hidden="true">
          <polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/>
          <line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/>
        </svg>
      </button>
    </div>
  </header>

  <div class="canvas-area" id="canvasArea">

    <div id="loader" role="status" aria-live="polite" aria-label="Chargement du jeu">
      <div class="loader-ring indeterminate" id="loaderRing">
        <svg viewBox="0 0 56 56" aria-hidden="true">
          <circle class="track" cx="28" cy="28" r="26"/>
          <circle class="fill"  cx="28" cy="28" r="26"/>
        </svg>
      </div>
      <div class="loader-info">
        <p class="loader-name">Socket Jump</p>
        <div class="progress-track" id="progressTrack" style="opacity:0">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <p class="loader-status" id="loaderStatus">Initialisation…</p>
      </div>
    </div>

    <div id="error-state" aria-live="assertive">
      <div class="error-icon" aria-hidden="true">✕</div>
      <p class="error-title">Impossible de charger le jeu</p>
      <p class="error-msg" id="errorMsg"></p>
      <a href="../index.html" class="btn-back-lg">← Retour au portfolio</a>
    </div>

    <canvas id="canvas" tabindex="1" aria-label="Zone de jeu Socket Jump"></canvas>

  </div>
</div>

<script src="socket-jump-loader.js"></script>
</body>
</html>
